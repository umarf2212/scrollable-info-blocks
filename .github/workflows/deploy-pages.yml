name: Deploy InfoBlocks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INFOBLOCKS_PAGES: "true"
      INFOBLOCKS_BASE_PATH: /scrollable-info-blocks
      NEXT_PUBLIC_BASE_PATH: /scrollable-info-blocks
      NEXT_PUBLIC_SITE_URL: https://umarf2212.github.io/scrollable-info-blocks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run lint
          node --test tests/content.test.mjs tests/navigation.test.mjs

      - name: Build static site
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/dsa-roadmap/index.html
          test -d dist/client/scrollable-info-blocks/_next
          mv dist/client/scrollable-info-blocks/_next dist/client/_next
          rmdir dist/client/scrollable-info-blocks
          touch dist/client/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
